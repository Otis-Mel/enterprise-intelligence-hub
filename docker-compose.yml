services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eih
      POSTGRES_PASSWORD: eih
      POSTGRES_DB: eih
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eih"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://eih:eih@db:5432/eih
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
